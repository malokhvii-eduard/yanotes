---
default_stages: [pre-commit]

default_language_version:
  python: python3.10

ci:
  skip: [commitlint]

repos:
  # Auto fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: fix trailing whitespace
      - id: end-of-file-fixer
        name: fix end of file

  # Style checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: fix python imports
        args: [--select, I, --fix]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        name: format python
  - repo: local
    hooks:
      - id: web-format
        name: format ts
        entry: npm --prefix web run format
        language: system
        pass_filenames: false
        files: ^web/.*\.(js|cjs|mjs|ts|tsx|vue)$

  # File checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        name: check json
      - id: check-toml
        name: check toml
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: check yaml
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        name: check markdown
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        name: check Dockerfile

  # Repo checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        name: check executables have shebangs
      - id: check-added-large-files
        name: check added large files
        exclude: ^docs/img/demo\.gif$
      - id: debug-statements
        name: check debug statements

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: check hardcoded secrets
        exclude: docker-compose.*
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: audit python security
        args: ["-c", "api/pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # Code checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: check python
  - repo: local
    hooks:
      - id: web-eslint
        name: check ts
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        files: ^web/.*\.(js|cjs|mjs|ts|tsx|vue)$
      - id: web-typecheck
        name: typecheck ts
        entry: npm --prefix web run typecheck
        language: system
        pass_filenames: false
        files: ^web/.*\.(js|cjs|mjs|ts|tsx|vue)$

  # Commit checks
  - repo: local
    hooks:
      - id: commitlint
        name: check commit message
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
