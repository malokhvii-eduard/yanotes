---
name: CI

"on":
  push:
  pull_request:

env:
  CONTAINER_REGISTRY: ghcr.io
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "24.14.0"

jobs:
  pre-commit:
    name: ✨️ ️Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit|${{ runner.os }}|${{ env.PYTHON_VERSION }}|${{
            hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  test-api:
    name: 🧪 Test · API
    runs-on: ubuntu-latest
    needs: pre-commit
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -vv --tb=short --color=yes

  test-web:
    name: 🧪 Test · Web
    runs-on: ubuntu-latest
    needs: pre-commit
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:coverage -- --reporter=verbose --includeTaskLocation

  build:
    name: 🐳 Build · ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - test-api
      - test-web
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: API
            context: api
          - module: Web
            context: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare image name
        id: image
        run: |
          image="${CONTAINER_REGISTRY}/${GITHUB_REPOSITORY}"
          image="${image}/${{ matrix.context }}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
