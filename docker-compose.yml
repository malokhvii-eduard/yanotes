version: "3.9"

x-common: &common
  restart: unless-stopped

services:
  gateway:
    <<: *common
    image: "traefik:${TRAEFIK_VERSION-2.6}"
    command:
      - --accesslog=true
      - --api.insecure=true
      - --entrypoints.http.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
    ports:
      - "80:80/tcp"
      - "8080:8080/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    labels:
      traefik.enable: true
      traefik.http.middlewares.compress.compress: true

  api:
    <<: *common
    image: yanotes/api
    build: api
    environment:
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME-5} # Minutes
      DB_HOST: ${DB_HOST-db}
      DB_NAME: ${DB_NAME?}
      DB_PASSWORD: ${DB_PASSWORD?}
      DB_PORT: ${DB_PORT-5432}
      DB_USER: ${DB_USER?}
      DEBUG: ${DEBUG-false}
      PAGE_SIZE: ${PAGE_SIZE-50}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME-60} # Days
      SECRET_KEY: ${SECRET_KEY?}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL?}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD?}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME?}
      TIME_ZONE: ${TIME_ZONE-UTC}
    depends_on:
      - db
    labels:
      traefik.enable: true
      traefik.http.routers.api.entrypoints: http
      traefik.http.routers.api.rule: >
        PathPrefix(`/api`)
        || PathPrefix(`/admin`)
        || PathPrefix(`/static`)
      traefik.http.routers.api.middlewares: compress
      traefik.http.services.api.loadbalancer.server.port:

  db:
    <<: *common
    image: "postgres:${POSTGRES_VERSION-14.2-alpine}"
    environment:
      POSTGRES_DB: ${DB_NAME?}
      POSTGRES_USER: ${DB_USER?}
      POSTGRES_PASSWORD: ${DB_PASSWORD?}
    ports:
      - "5432:5432/tcp"
    volumes:
      - ./api/scripts/db:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data

volumes:
  db:
