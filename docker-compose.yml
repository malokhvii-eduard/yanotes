---
x-common: &common
  restart: unless-stopped

x-api-environment: &api-environment
  ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME-5}  # Minutes
  CACHE_HOST: cache
  DB_HOST: "${DB_HOST-db}"
  DB_NAME: "${DB_NAME?}"
  DB_PASSWORD: "${DB_PASSWORD?}"
  DB_PORT: "${DB_PORT-5432}"
  DB_USER: "${DB_USER?}"
  DEBUG: "${DEBUG-false}"
  PAGE_SIZE: "${PAGE_SIZE-50}"
  REFRESH_TOKEN_LIFETIME: "${REFRESH_TOKEN_LIFETIME-60}"  # Days
  SECRET_KEY: "${SECRET_KEY?}"
  SUPERUSER_EMAIL: "${SUPERUSER_EMAIL?}"
  SUPERUSER_PASSWORD: "${SUPERUSER_PASSWORD?}"
  SUPERUSER_USERNAME: "${SUPERUSER_USERNAME?}"
  TIME_ZONE: "${TIME_ZONE-UTC}"

services:
  gateway:
    <<: *common
    image: "traefik:${TRAEFIK_VERSION-3.6.13}"
    command:
      - --accesslog=true
      - --ping=true
      - --api.insecure=true
      - --entrypoints.http.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
    ports:
      - "80:80/tcp"
      - "8080:8080/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  web:
    <<: *common
    image: yanotes/web
    build: web
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: true
      traefik.http.routers.web.entrypoints: http
      traefik.http.routers.web.priority: 1
      traefik.http.routers.web.rule: PathPrefix(`/`)

  api:
    <<: *common
    image: yanotes/api
    build: api
    environment: *api-environment
    depends_on:
      migrations:
        condition: service_completed_successfully
    labels:
      traefik.enable: true
      traefik.http.middlewares.api_compress.compress: true
      traefik.http.routers.api.entrypoints: http
      traefik.http.routers.api.priority: 10
      traefik.http.routers.api.rule: >
        PathPrefix(`/api`)
        || PathPrefix(`/admin`)
        || PathPrefix(`/static`)
      traefik.http.routers.api.middlewares: api_compress

  migrations:
    image: yanotes/api
    build: api
    restart: "no"
    entrypoint: ["python", "manage.py"]
    command: ["migrate", "--noinput"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  cache:
    <<: *common
    image: "redis:${REDIS_VERSION-7.4.8-alpine}"
    ports:
      - "6379:6379/tcp"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  db:
    <<: *common
    image: "postgres:${POSTGRES_VERSION-14.19-alpine}"
    environment:
      POSTGRES_DB: "${DB_NAME?}"
      POSTGRES_USER: "${DB_USER?}"
      POSTGRES_PASSWORD: "${DB_PASSWORD?}"
    ports:
      - "5432:5432/tcp"
    volumes:
      - ./api/scripts/db:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -d ${DB_NAME} -U ${DB_USER}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  db:
