[project]
name = "yanotes"
version = "1.0.0"
description = "API for yet another note-taking app"
authors = [{ name = "Eduard Malokhvii", email = "malokhvii.ee@gmail.com" }]
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "Django>=4.1,<5.0",
    "django-admin-interface>=0.20.0,<0.21.0",
    "django-cacheops>=6.1,<7.0",
    "django-cors-headers>=3.13.0,<4.0.0",
    "django-environ>=0.9.0,<0.10.0",
    "django-filter>=22.1,<23.0",
    "django-structlog>=3.0.1,<4.0.0",
    "django-watchman>=1.3.0,<2.0.0",
    "djangorestframework>=3.13.1,<4.0.0",
    "djangorestframework-simplejwt>=5.2.0,<6.0.0",
    "drf-spectacular[sidecar]>=0.24.0,<0.25.0",
    "gunicorn>=25.3.0,<26.0.0",
    "psycopg2-binary>=2.9.3,<3.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
preview = true
