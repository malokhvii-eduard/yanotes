[project]
name = "yanotes"
version = "1.0.0"
description = "API for yet another note-taking app"
authors = [{ name = "Eduard Malokhvii", email = "malokhvii.ee@gmail.com" }]
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "Django>=5.0,<5.3",
    "django-admin-interface>=0.30.0,<0.33.0",
    "django-cacheops>=7.2,<8.0",
    "django-cors-headers>=4.4.0,<5.0.0",
    "django-environ>=0.9.0,<0.10.0",
    "django-filter>=24.2,<25.0",
    "django-structlog>=3.0.1,<4.0.0",
    "django-watchman>=1.3.0,<2.0.0",
    "djangorestframework>=3.15.0,<4.0.0",
    "djangorestframework-simplejwt>=5.2.0,<6.0.0",
    "drf-spectacular[sidecar]>=0.27.0,<0.28.0",
    "gunicorn>=25.3.0,<26.0.0",
    "psycopg2-binary>=2.9.3,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-django>=4.11.1,<5.0.0",
    "pytest-randomly>=4.0.1,<5.0.0",
    "pytest-sugar>=1.1.1,<2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
preview = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yanotes.test_settings"
addopts = "-ra --strict-markers"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["yanotes"]
